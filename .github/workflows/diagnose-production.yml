name: Diagnose production (temporary)

on:
  push:
    branches: [assets/showcase-photos]
    paths: [.github/workflows/diagnose-production.yml]

permissions:
  contents: read

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the reference photo lookup against Wikipedia
        env:
          APP_ENV: development
          NEXT_PUBLIC_APP_URL: https://ridekmerw.vercel.app
          BETTER_AUTH_SECRET: diagnosis-only-secret-0123456789abcdef
          BETTER_AUTH_URL: https://ridekmerw.vercel.app
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
          CRON_SECRET: diagnosis-only-secret-0123
        run: |
          cat > ./photo-check.ts <<'TS'
          import { parseImageInfo, pickPageImage } from "./src/server/vehicles/reference-image";
          import { referenceQuery } from "./src/features/vehicles/catalog";
          const API = "https://en.wikipedia.org/w/api.php";
          const get = async (params: Record<string, string>) => {
            const url = `${API}?${new URLSearchParams({ format: "json", formatversion: "2", origin: "*", ...params })}`;
            const res = await fetch(url, { headers: { "user-agent": "RideKmer/1.0 (+https://ridekmerw.vercel.app)" } });
            console.log("HTTP", res.status, url.slice(0, 160));
            return res.json();
          };
          (async () => {
            const q = referenceQuery("Toyota", "Land Cruiser Prado");
            console.log("referenceQuery =", JSON.stringify(q));
            const search = await get({ action: "query", generator: "search", gsrsearch: `${q} 2025`, gsrlimit: "5", gsrnamespace: "0", prop: "pageimages", piprop: "name", pilicense: "free" });
            const file = pickPageImage(search, "Toyota");
            console.log("picked file =", file);
            if (!file) return;
            const info = await get({ action: "query", titles: `File:${file}`, prop: "imageinfo", iiprop: "url|size|extmetadata", iiurlwidth: "960", iiextmetadatafilter: "Artist|LicenseShortName|LicenseUrl" });
            console.log("imageinfo raw =", JSON.stringify(info).slice(0, 1500));
            console.log("parsed =", JSON.stringify(parseImageInfo(info)));
          })();
          TS
          pnpm exec tsx ./photo-check.ts
      - name: Raw Wikipedia search answer
        if: always()
        run: |
          curl -sS -A "RideKmer/1.0 (+https://ridekmerw.vercel.app)" \
            "https://en.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&action=query&generator=search&gsrsearch=Toyota%20Land%20Cruiser%20Prado%202025&gsrlimit=5&gsrnamespace=0&prop=pageimages&piprop=name&pilicense=free" | head -c 2000
