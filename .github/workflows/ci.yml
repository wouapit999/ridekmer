name: CI

on:
  push:
    branches: [main, develop, "feature/**", "claude/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholder values for build-time validation only. No real secrets live in this file;
  # deployments are handled by Vercel's GitHub integration with its own environment variables.
  NODE_ENV: test
  APP_ENV: development
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789abcdef
  APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  CRON_SECRET: ci-only-cron-secret-0123456789
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ridekmer_test?schema=public
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ridekmer_test?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ridekmer_test?schema=public
  ALLOW_DEMO_SEED: "false"

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ridekmer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency audit (production, high and above)
        run: pnpm audit --prod --audit-level=high

      - name: Unit tests
        run: pnpm test

      - name: Validate migrations
        run: pnpm exec prisma migrate deploy && pnpm exec prisma migrate status

      - name: Integration tests
        run: pnpm test:integration

      - name: Coverage (unit + integration)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

      - name: Production build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ridekmer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALLOW_DEMO_SEED: "true"
      AUTH_RATE_LIMIT_MULTIPLIER: "20"
      CRON_SECRET: ci-only-cron-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare database
        run: pnpm exec prisma migrate deploy && pnpm db:seed
      - name: Build
        run: pnpm build
      - name: Run Playwright
        run: pnpm test:e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
