name: Bug report
description: Something is not working as expected
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug. Do not paste personal data, identity documents or payment references.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (preview URL / production, device, browser, language)
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Blocking, High, Medium, Low]
    validations:
      required: true
